server.port=8080
server.error.include-message=always
# Default DB = file-based H2 (zero setup). For MySQL set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (see docker-compose.yml)
spring.datasource.url=jdbc:h2:file:./data/supportai;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.jwt.secret=${JWT_SECRET:change-this-secret-change-this-secret-please-1234567890}
app.jwt.expiration-ms=86400000
app.ai.url=${AI_URL:http://localhost:8000}
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}
